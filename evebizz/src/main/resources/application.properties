spring.application.name=evebizz
# ---- Database ----
datasource:
spring.datasource.url=jdbc:mysql://localhost:3306/evebizz-db
username:${DB_USERNAME:root}
password:${DB_PASSWORD:password}
hikari:
maximum-pool-size:10
minimum-idle:5
connection-timeout:30000
idle-timeout:600000
max-lifetime:1800000
# ---- JPA ----
jpa:
ddl-auto:validate   # flyway handles schema, hibernate just validates
show-sql:false
properties:
hibernate:
dialect:org.hibernate.dialect.MySQLDialect
format_sql:true
default_batch_fetch_size:25 
# ---- Flyway Migrations ----
flyway:
enabled:true
locations:classpath:db/migration
baseline-on-migrate:true
# ---- Mail ----
host:${MAIL_HOST:smtp.gmail.com}
port:${MAIL_PORT:587}
mail:
smtp:
auth:true
starttls:
enable:true
# ---- File Upload ----
servlet:
multipart:
max-file-size:10MB
max-request-size:10MB
# ---- Server ----
server:
error:
include-message:never     # Don't leak error messages in prod
include-stacktrace:never
compression:
# ---- JWT ----
jwt:
secret:${JWT_SECRET:your-very-long-secret-key-minimum-256-bits-change-this-in-production}
expiration:86400000         # 24 hours in ms
refresh-expiration:604800000 # 7 days in ms
# ---- App Config ----
app:
frontend-url:${FRONTEND_URL:http://localhost:3000}
from:${MAIL_FROM:noreply@eventhub.com}
from-name:"EventHub"
# ---- Actuator ----
management:
endpoints:
web:
exposure:
include:health,info,metrics
endpoint:
health:
show-details:when-authorized
# ---- Logging ----
logging:
level:
com.eventhub:INFO
org.springframework.security:WARN
org.hibernate.SQL:WARN
pattern:
console:"%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
